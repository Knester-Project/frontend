<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Primary SEO -->
  <title>Knester — Private Social Network</title>
  <meta
    name="description"
    content="Knester is a private social network where invited people connect, share, and interact in a trusted community."
  />
  <meta
    name="keywords"
    content="Knester, private social network, invite-only social network, private community, social media"
  />
  <meta name="author" content="Knester" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://knester.com/" />

  <!-- Favicon -->

  <!-- Viewport -->

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Knester — Private Social Network" />
  <meta
    property="og:description"
    content="A private, invite-only social network for connecting and sharing with people you trust."
  />
  <meta property="og:image" content="https://s3.af-south-1.amazonaws.com/knester.public.media/management/logo.png" />
  <meta property="og:image:alt" content="Knester logo" />
  <meta property="og:site_name" content="Knester" />
  <meta property="og:url" content="https://knester.com/" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Knester — Private Social Network" />
  <meta
    name="twitter:description"
    content="A private, invite-only social network for connecting and sharing with people you trust."
  />
  <meta name="twitter:image" content="https://s3.af-south-1.amazonaws.com/knester.public.media/management/logo.png" />
  <meta name="twitter:image:alt" content="Knester logo" />

   <!-- Schema Markup to Improve SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Knester",
      "url": "https://www.knester.com",
      "logo": "https://s3.af-south-1.amazonaws.com/knester.public.media/management/logo.png",
      "description": "A private, invite-only social network for connecting and sharing with people you trust."
    }
  </script>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fe7f2d" />

</head>
